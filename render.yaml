services:
  - type: web
    name: hikawi-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SPEECHMATICS_API_KEY
        sync: false
      - key: VOICE_API_URL
        sync: false
