name: Deploy Backend to Azure Web App

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/azure-deploy.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install -r requirements/base.txt
          pip install -r requirements/dev.txt
          
      - name: Run deployment tests
        env:
          GEMINI_API_KEY: "dummy_key_for_tests"
        # We only run the deployment test since it doesn't require a DB
        run: pytest tests/test_deployment.py -v

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
          
      - name: Build and push container image to registry
        run: |
          cd backend
          docker build -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/hakawi-backend:${{ github.sha }} .
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/hakawi-backend:${{ github.sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy container to Azure Web App
        run: |
          az webapp config container set \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --resource-group hakawi-rg \
            --container-image-name ${{ secrets.REGISTRY_LOGIN_SERVER }}/hakawi-backend:${{ github.sha }} \
            --container-registry-url https://${{ secrets.REGISTRY_LOGIN_SERVER }} \
            --container-registry-user ${{ secrets.REGISTRY_USERNAME }} \
            --container-registry-password ${{ secrets.REGISTRY_PASSWORD }}
          az webapp restart --name ${{ secrets.AZURE_WEBAPP_NAME }} --resource-group hakawi-rg
