<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>حكاوي — تكلم مع الماضي</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;600&display=swap" rel="stylesheet"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #1a0e05;
  color: #e8d1a7;
  font-family: 'Cairo', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

header {
  width: 100%;
  padding: 2rem;
  text-align: center;
  border-bottom: 1px solid rgba(232,209,167,0.15);
  background: rgba(0,0,0,0.3);
}

.logo {
  font-family: 'Amiri', serif;
  font-size: 3rem;
  color: #e8d1a7;
  letter-spacing: 0.05em;
}

.tagline {
  font-size: 0.9rem;
  color: #9d9167;
  margin-top: 0.3rem;
  letter-spacing: 0.1em;
}

.chat-container {
  width: 100%;
  max-width: 800px;
  flex: 1;
  padding: 2rem 1rem;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

.message {
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.message.user {
  align-items: flex-start;
}

.message.character {
  align-items: flex-end;
}

.bubble {
  max-width: 75%;
  padding: 1rem 1.4rem;
  border-radius: 12px;
  line-height: 1.9;
  font-size: 1rem;
}

.message.user .bubble {
  background: rgba(132,89,43,0.25);
  border: 1px solid rgba(132,89,43,0.4);
  border-radius: 12px 12px 4px 12px;
}

.message.character .bubble {
  background: rgba(232,209,167,0.07);
  border: 1px solid rgba(232,209,167,0.15);
  border-radius: 12px 12px 12px 4px;
  font-family: 'Amiri', serif;
  font-size: 1.15rem;
}

.meta {
  font-size: 0.75rem;
  color: #9d9167;
  padding: 0 0.5rem;
}

.monument-tag {
  display: inline-block;
  background: rgba(116,48,20,0.4);
  border: 1px solid rgba(116,48,20,0.6);
  color: #e8a87c;
  font-size: 0.75rem;
  padding: 0.2rem 0.7rem;
  border-radius: 20px;
  margin-bottom: 0.4rem;
}

.input-area {
  width: 100%;
  max-width: 800px;
  padding: 1rem;
  position: sticky;
  bottom: 0;
  background: linear-gradient(to top, #1a0e05 80%, transparent);
}

.input-row {
  display: flex;
  gap: 0.7rem;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(232,209,167,0.2);
  border-radius: 12px;
  padding: 0.5rem;
}

input[type="text"] {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: #e8d1a7;
  font-family: 'Cairo', sans-serif;
  font-size: 1rem;
  padding: 0.5rem;
  text-align: right;
  direction: rtl;
}

input::placeholder { color: #5c3d1e; }

button {
  background: #84592b;
  color: #f5edd8;
  border: none;
  padding: 0.6rem 1.4rem;
  border-radius: 8px;
  font-family: 'Cairo', sans-serif;
  font-size: 0.9rem;
  cursor: pointer;
  transition: background 0.2s;
  white-space: nowrap;
}

button:hover { background: #743014; }
button:disabled { background: #3a2010; color: #5c3d1e; cursor: not-allowed; }

.loading {
  text-align: center;
  color: #9d9167;
  font-size: 0.9rem;
  padding: 1rem;
  display: none;
}

.loading.show { display: block; }

.suggestions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-bottom: 1rem;
  justify-content: center;
}

.suggestion {
  background: rgba(132,89,43,0.15);
  border: 1px solid rgba(132,89,43,0.3);
  color: #c4a882;
  padding: 0.4rem 0.9rem;
  border-radius: 20px;
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.2s;
  font-family: 'Cairo', sans-serif;
}

.suggestion:hover {
  background: rgba(132,89,43,0.3);
  color: #e8d1a7;
}
</style>
</head>
<body>

<header>
  <div class="logo">حكاوي</div>
  <div class="tagline">تكلم مع الماضي · Walk through Egypt</div>
</header>

<div class="chat-container" id="chat">
  <div class="message character">
    <div class="monument-tag">🏛️ حكاوي</div>
    <div class="bubble">
      أهلاً بك في حكاوي. أنا هنا أحكيلك قصص الأماكن اللي شهدت تاريخ مصر. اسأل عن أي أثر، وهتسمع صوت اللي بناه.
    </div>
  </div>
</div>

<div class="input-area">
  <div class="suggestions">
    <span class="suggestion" onclick="ask('من بنى الهرم الأكبر؟')">من بنى الهرم الأكبر؟</span>
    <span class="suggestion" onclick="ask('حتشبسوت مين؟')">حتشبسوت مين؟</span>
    <span class="suggestion" onclick="ask('إيه قصة مسجد ابن طولون؟')">إيه قصة مسجد ابن طولون؟</span>
    <span class="suggestion" onclick="ask('عمال دير المدينة كانوا بيعيشوا إزاي؟')">عمال دير المدينة كانوا بيعيشوا إزاي؟</span>
  </div>
  <div class="loading" id="loading">⏳ بنسأل الشخصية...</div>
  <div class="input-row">
    <button onclick="sendQuestion()" id="btn">اسأل</button>
    <input type="text" id="questionInput" placeholder="اسأل عن أي أثر مصري..." onkeydown="if(event.key==='Enter') sendQuestion()"/>
  </div>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('questionInput');
const btn = document.getElementById('btn');
const loading = document.getElementById('loading');

function ask(text) {
  input.value = text;
  sendQuestion();
}

function addMessage(type, text, monument, builder) {
  const div = document.createElement('div');
  div.className = `message ${type}`;

  if (type === 'character') {
    div.innerHTML = `
      <div class="monument-tag">🏛️ ${monument} · ${builder}</div>
      <div class="bubble">${text.replace(/\n/g, '<br>')}</div>
    `;
  } else {
    div.innerHTML = `
      <div class="bubble">${text}</div>
      <div class="meta">أنت</div>
    `;
  }

  chat.appendChild(div);
  div.scrollIntoView({ behavior: 'smooth' });
}

async function sendQuestion() {
  const question = input.value.trim();
  if (!question) return;

  input.value = '';
  btn.disabled = true;
  loading.classList.add('show');

  addMessage('user', question);

  try {
    const res = await fetch('http://localhost:5000/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question })
    });

    const data = await res.json();
    addMessage('character', data.answer, data.monument, data.builder);
  } catch (err) {
    addMessage('character', '⚠️ في مشكلة في الاتصال بالسيرفر', 'خطأ', '');
  }

  btn.disabled = false;
  loading.classList.remove('show');
  input.focus();
}
</script>
</body>
</html>
